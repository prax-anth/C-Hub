<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account · Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body data-page="register">

  <div class="bg" aria-hidden="true"></div>
  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>
  <div class="blob blob-3" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <main class="card" role="main">
    <div class="card-glow" aria-hidden="true"></div>

    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 14.4 7.2 16.9l.9-5.4L4.2 7.7l5.4-.8L12 2z"/>
      </svg>
    </div>

    <h1 id="register-title" tabindex="-1">Create your <span class="grad">account</span></h1>
    <p class="subtitle">Start building with Nova — free while in beta. No credit card required.</p>

    <form id="register-form" novalidate>
      <!-- 1. Email / Phone -->
      <div class="field-group">
        <label for="reg-contact">Email or phone</label>
        <div class="input-wrap" id="wrap-reg-contact">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="3"/>
            <path d="m2 7 8.6 5.7a2.5 2.5 0 0 0 2.8 0L22 7"/>
          </svg>
          <input id="reg-contact" name="contact" type="text" autocomplete="username"
                 placeholder="you@example.com or +1 555 000 1234" aria-describedby="reg-contact-msg" />
        </div>
        <p class="msg" id="reg-contact-msg" role="alert" aria-live="polite"></p>
      </div>

      <!-- 2. Password -->
      <div class="field-group">
        <label for="reg-password">Password</label>
        <div class="input-wrap" id="wrap-reg-password">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/>
            <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
          </svg>
          <input id="reg-password" name="password" type="password" autocomplete="new-password"
                 placeholder="Create a strong password" aria-describedby="reg-password-msg" />
          <button type="button" class="toggle-pass" data-target="reg-password" aria-pressed="false" aria-label="Show password">
            <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.5 10.5 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="m2 2 20 20"/>
            </svg>
          </button>
        </div>
        <div class="strength" id="reg-strength" hidden>
          <span></span><span></span><span></span><span></span>
        </div>
        <p class="msg" id="reg-password-msg" role="alert" aria-live="polite"></p>
      </div>

      <!-- 3. Confirm Password -->
      <div class="field-group">
        <label for="reg-confirm">Confirm password</label>
        <div class="input-wrap" id="wrap-reg-confirm">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/>
            <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
          </svg>
          <input id="reg-confirm" name="confirm" type="password" autocomplete="new-password"
                 placeholder="Re-enter your password" aria-describedby="reg-confirm-msg" />
          <button type="button" class="toggle-pass" data-target="reg-confirm" aria-pressed="false" aria-label="Show confirm password">
            <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.5 10.5 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="m2 2 20 20"/>
            </svg>
          </button>
        </div>
        <p class="msg" id="reg-confirm-msg" role="alert" aria-live="polite"></p>
      </div>

      <button type="submit" class="btn" id="register-btn" disabled>Create Account</button>
    </form>

    <p class="alt">Already have an account? <a href="login.html">Login</a></p>

    <p class="legal">By creating an account you agree to our Terms &amp; Privacy Policy</p>
  </main>

<script src="../js/auth.js?v=2"></script>
<script src="../js/script.js?v=5"></script>
</body>
</html>
